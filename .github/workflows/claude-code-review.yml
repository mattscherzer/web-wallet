name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Skip draft PRs to conserve tokens and avoid reviewing WIP code
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is required so git diff can trace the PR's base commit
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Apply the following Review Rubric:

            1. Standards & Context:
               - Adhere strictly to the project's root `CLAUDE.md` and `.claude/skills/adversarial-review/SKILL.md`.

            2. Apply `docs/coding-standards.md`.

            3. Report violations of the rules tagged `review`, citing the rule number (for example "rule 3.3").

            4. Do not report what lint, types, tests or CI already enforce (rules tagged `lint`, `types`, `format`, `test` or `CI`).

            5. Output Requirements:
               - Provide line-level actionable comments using the inline comment tool.
               - Classify each issue strictly as:
                 - `[CRITICAL]`: Security/RLS risks, unhandled network errors, broken cache invalidation, or false-positive tests.
                 - `[BLOAT / YAGNI]`: Over-engineered abstractions, unused helpers, or dead code.
                 - `[IMPROVEMENT]`: Minor idiomatic React or TypeScript cleanups.
               - Conclude with a summary checklist of blocking `[CRITICAL]` issues before human sign-off. If none exist, output: "LGTM: No architectural flaws or security regressions detected."
